services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: academy
      MYSQL_USER: academy
      MYSQL_PASSWORD: academy
      MYSQL_ROOT_PASSWORD: root-academy
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - academy-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uacademy", "-pacademy"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - academy-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: academy
      MINIO_ROOT_PASSWORD: academy-secret
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - academy-net
    restart: unless-stopped

networks:
  academy-net:
    name: zhaoyao-academy-net
    driver: bridge

volumes:
  mysql-data:
    name: zhaoyao-academy-mysql-data
  redis-data:
    name: zhaoyao-academy-redis-data
  minio-data:
    name: zhaoyao-academy-minio-data
