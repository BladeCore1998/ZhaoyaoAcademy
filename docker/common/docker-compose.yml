services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: academy
      MYSQL_USER: academy
      MYSQL_PASSWORD: academy
      MYSQL_ROOT_PASSWORD: root-academy
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - academy-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uacademy", "-pacademy"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - academy-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-academy}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-academy-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    networks:
      - academy-net
    restart: unless-stopped

networks:
  academy-net:
    name: zhaoyao-academy-net
    driver: bridge

volumes:
  mysql-data:
    name: zhaoyao-academy-mysql-data
  redis-data:
    name: zhaoyao-academy-redis-data
  rustfs-data:
    name: zhaoyao-academy-rustfs-data
