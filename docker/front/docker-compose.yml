services:
  # 手动迁移入口，不随 `up` 启动：
  # docker compose -f docker/front/docker-compose.yml run --rm academy-migrate
  academy-migrate:
    profiles:
      - migrate
    build:
      context: ../../academy-front
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - path: ../../academy-front/.env.example
        required: true
      - path: ../../academy-front/.env
        required: false
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://academy:academy@mysql:3306/academy}
      TZ: Asia/Shanghai
    command:
      - sh
      - -c
      - >-
        node -e 'const net=require("net"); const database=new URL(process.env.DATABASE_URL);
        const deadline=Date.now()+120000;
        (function wait(){const socket=net.createConnection({host:database.hostname,port:Number(database.port||3306)});
        socket.on("connect",()=>{socket.end(); process.exit(0)}).on("error",()=>{socket.destroy();
        if(Date.now()>deadline) process.exit(1); setTimeout(wait,2000)})})()'
        && pnpm db:migrate
    networks:
      - academy-net
    restart: "no"

  academy-front:
    build:
      context: ../../academy-front
      dockerfile: Dockerfile
    env_file:
      - path: ../../academy-front/.env.example
        required: true
      - path: ../../academy-front/.env
        required: false
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://academy:academy@mysql:3306/academy}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-http://rustfs:9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-academy}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-academy-secret}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-zhaoyao-academy}
      TZ: Asia/Shanghai
    ports:
      - "${FRONT_PORT:-3000}:3000"
    networks:
      - academy-net
    restart: unless-stopped

networks:
  academy-net:
    external: true
    name: zhaoyao-academy-net
